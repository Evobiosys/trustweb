# TrustWeb for Android (wave 11): on a version tag (v0.2.1, v0.3.0 ...) build the Trusted Web Activity APK (android/),
# sign it with the release key from the repository secrets, check that the origin's assetlinks.json names that key, and
# publish trustweb-<version>.apk (+ trustweb.apk, the stable name the website links) as a GitHub Release.
#
# Secrets (scripts/android_keystore.sh --push-secrets sets them): ANDROID_KEYSTORE_B64 (the .keystore, base64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (trustweb), ANDROID_KEY_PASSWORD. The key never enters git.
name: android-release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: version from the tag (v0.2.1 -> name 0.2.1, code 201)
        id: ver
        run: |
          tag="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<<"$(echo "$tag" | sed -E 's/[^0-9.].*$//')"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "APK $tag (versionCode $code)"
      - name: release key from the secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "::error::secret ANDROID_KEYSTORE_B64 is missing: run scripts/android_keystore.sh --push-secrets"; exit 1; fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: the origin's assetlinks.json must name this key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          fp=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "${ANDROID_KEY_ALIAS:-trustweb}" | sed -n 's/^.*SHA256: //p' | head -1)
          echo "signing key SHA-256: $fp"
          if ! grep -q "$fp" apps/trustweb/pwa/.well-known/assetlinks.json; then
            echo "::error::apps/trustweb/pwa/.well-known/assetlinks.json does not name this key ($fp): run scripts/android_keystore.sh --assetlinks-only and commit"; exit 1
          fi
      - name: build and sign
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon -PtwVersionName=${{ steps.ver.outputs.name }} -PtwVersionCode=${{ steps.ver.outputs.code }}
      - name: name the files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/trustweb-${{ steps.ver.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk out/trustweb.apk
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: trustweb-apk-${{ steps.ver.outputs.name }}
          path: out
          retention-days: 90
      - uses: softprops/action-gh-release@v2
        with:
          name: TrustWeb ${{ github.ref_name }}
          files: |
            out/trustweb-${{ steps.ver.outputs.name }}.apk
            out/trustweb.apk
            out/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            **Android app (APK)**: on the phone, tap `trustweb.apk` below (or open https://trustweb.one/apk), then open the download and allow installing from this source once.
            It is the web app https://app.trustweb.one/ as a Trusted Web Activity, with notifications while the app is closed
            (Settings > Notifications, each kind on its own). Same version as the web app.
