# TrustWeb on every push (GitHub-hosted runner, free minutes of a private repo). Push only (except the small reach-out-link job): a pull request
# from a branch of this private repo shows the push run's result, so a second pull_request run would double the minutes.
# Two steps (Jakob 2026-10-13): a quick look first (local preview, or pre.trustweb.one for a cloud branch), then
# the verified step. So two jobs run side by side: `bundle` builds the app fast (about 30 s; its artifact
# trustweb-<sha> feeds pre.trustweb.one, and once `checks` passed the same bytes feed dev.trustweb.one),
# `checks` runs typecheck and the unit suites (about 2 min). Neither ever blocks the local preview.
name: ci
on:
  push:
  pull_request:   # only the reach-out-link job runs on it (the other jobs keep push only, see their `if`)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bundle:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the workspace packages apps/demo imports (their main is dist/)
        run: pnpm --filter "@ew/demo^..." build
      - name: build (base /, app.trustweb.one; apps/crm Vite 8, its Svelte plugin needs it)
        working-directory: apps/trustweb
        env:
          TW_BASE: /
          TW_RELEASE: ${{ github.sha }}
        run: ../crm/node_modules/.bin/vite build --outDir dist --emptyOutDir
      - name: private-line scan
        run: node apps/trustweb/test/scan_bundle_for_private_lines.mjs apps/trustweb/dist
      - name: demo pages never load the app entry (they stayed blank when they did, 2026-10-19)
        run: node apps/trustweb/test/scan_demo_entries.mjs apps/trustweb/dist
      - uses: actions/upload-artifact@v4
        with:
          name: trustweb-${{ github.sha }}
          path: apps/trustweb/dist
          retention-days: 30
          include-hidden-files: true   # .well-known/assetlinks.json (the Android app's pairing; v4 drops dot-paths otherwise)
  checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # wave6i_conversation reads an older wire.ts from git history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the workspace packages apps/demo imports (their main is dist/)
        run: pnpm --filter "@ew/demo^..." build
      - name: typecheck
        working-directory: apps/trustweb
        run: ../demo/node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: unit tests (trustweb)
        working-directory: apps/demo
        run: node_modules/.bin/vitest run --config ../trustweb/test/unit/vitest.config.mjs --root ../trustweb
      - name: unit tests (demo)
        working-directory: apps/demo
        run: node_modules/.bin/vitest run
      # packages/device-sync (docs/design/device-sync-e2ee.md): zero-dependency package, tests run on node:test (Node >= 22.18 strips types itself).
      - name: device-sync package (typecheck + unit tests)
        run: pnpm --filter @resource-web/device-sync typecheck && pnpm --filter @resource-web/device-sync test
      - name: DLP restore drill tool, its CI wrapper and the workflow contract (node:test, stdlib only)
        run: node --test services/trustweb-backup/test/restore_drill.test.mjs services/trustweb-backup/test/restore_drill_ci.test.mjs services/trustweb-backup/test/dlp_drill_workflow.test.mjs
  # Full workspace gates from a clean clone (cloud/green-gates, 2026-11-02): what `pnpm typecheck && pnpm lint && pnpm test`
  # runs locally, every package. `--no-bail` keeps going after a failing package so one run shows the whole inventory;
  # the step still fails if any package fails.
  gates:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: workspace packages consumed from dist/ build their deps before typecheck/test
        run: node --test scripts/test_workspace_build_deps.mjs
      - name: typecheck (all packages)
        run: pnpm -r --no-bail typecheck
      - name: lint (all packages)
        run: pnpm lint
      - name: test (all packages)
        run: pnpm -r --no-bail test
  # cloud/iroh-relay-live (2026-11-02): packages/transport had no CI coverage at all (the iroh rung, relay failover and the
  # sidecar endpoint live there). Typecheck + vitest for protocol and transport; the synapse-bound suites self-skip, the iroh
  # sidecar integration suite self-skips while no `trustweb-iroh-sidecar` binary is on PATH (building it needs cargo + crates.io).
  transport:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build @resource-web/protocol (transport imports its dist/)
        run: pnpm --filter @resource-web/protocol build
      - name: typecheck (protocol, transport)
        run: pnpm --filter @resource-web/protocol --filter @resource-web/transport typecheck
      - name: unit tests (protocol, transport)
        run: pnpm --filter @resource-web/protocol --filter @resource-web/transport test
  # wave 14: trustweb.one/<name> must always end in a real page (a typeless empty 404 showed as a 0-byte download on phones). Hits production, stdlib python only.
  reach-out-link:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/test_reach_out_chain.py
