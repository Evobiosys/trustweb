<!doctype html>
<html lang="en" data-palette="evobiosys">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- review-wave2: the web-search links (and fediverse links) must not even be resolved before a tap (Safari prefetches link hosts' DNS) -->
  <meta http-equiv="x-dns-prefetch-control" content="off" />
  <meta name="description" content="TrustWeb: ask the people you have met, and the people they trust. A question travels, the data stays." />
  <!-- boot:theme -->
  <script>
(function () {
  var t = 'system';
  try {
    var v = localStorage.getItem('tw-theme');
    if (v === 'light' || v === 'dark') t = v;
  } catch (e) {}
  document.documentElement.dataset.theme = t;
  var m = 'on';
  try {
    var c = navigator.connection;
    var slow = c && (c.saveData || c.effectiveType === 'slow-2g' || c.effectiveType === '2g' || c.effectiveType === '3g');
    if (slow || matchMedia('(prefers-reduced-motion: reduce)').matches) m = 'off';
  } catch (e) {}
  document.documentElement.dataset.motion = m;
})();
  </script>
  <!-- /boot:theme -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none' stroke='%2313867E'%3E%3Ccircle cx='20' cy='20' r='5.5' stroke-width='3'/%3E%3Cpath d='M20 8.5 A11.5 11.5 0 1 1 8.5 20' stroke-width='1.7' stroke-linecap='round'/%3E%3Cpath d='M37 20 A17 17 0 1 1 20 3' stroke-width='1.7' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='3' r='2.3' fill='%2313867E' stroke='none'/%3E%3C/svg%3E" />
  <title>TrustWeb</title>
  <style>
    /* Wave 16: what shows before the bundle runs; the start screen's colours, so the swap is quiet. */
    [data-loading]{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#F5F0E8;color:#1F2A28;font-family:Inter,Seravek,"Avenir Next","Segoe UI",system-ui,sans-serif}
    [data-loading] .logo{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#fff;background:linear-gradient(135deg,#C2573A,#2F6F74)}
    [data-loading] b{font-size:34px;font-weight:600}
    [data-loading] span{color:#5A6B66;font-size:14px}
    /* Light is the default; dark when the person chose it (html[data-theme="dark"], set by the boot block) or follows the system. */
    html[data-theme="dark"] [data-loading]{background:#26241F;color:#F1EEE6} html[data-theme="dark"] [data-loading] span{color:#BDB6A8}
    @media (prefers-color-scheme:dark){html[data-theme="system"] [data-loading]{background:#26241F;color:#F1EEE6} html[data-theme="system"] [data-loading] span{color:#BDB6A8}}
  </style>
</head>
<body>
  <div id="app"><div data-loading>
    <div class="logo">◎</div>
    <b>TrustWeb</b>
    <span>Loading…</span>
  </div></div>
  <noscript>TrustWeb needs JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
